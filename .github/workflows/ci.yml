name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project (editable) with dev tools
        run: pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check aster tests

      - name: Format (ruff format --check)
        run: ruff format --check aster tests

      - name: Types (mypy)
        run: mypy

      - name: Tests (unittest, offline)
        run: python -B -m unittest discover -s tests -v
