[project]
name = "aster"
version = "0.1.0"
description = "两人共同演进的智能体客服学习项目：消息边界、Agent 对话、工具调用、RAG 与多渠道实验"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "anthropic>=1.3.0",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16.5",
    "mypy>=2.3.1",
]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["aster"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import order
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
]

[tool.mypy]
python_version = "3.11"
files = ["aster"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
